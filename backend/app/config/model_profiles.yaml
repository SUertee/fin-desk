# Entry-router intent classification: tiny, cold, fast-fail. The guard
# falls back to deterministic routing on any timeout or invalid output.
router:
  provider: deepseek
  model: deepseek-chat
  api_key_env: DEEPSEEK_API_KEY
  api_base_url: https://api.deepseek.com/v1
  temperature: 0.0
  max_tokens: 150
  timeout_seconds: 10
  input_cost_per_1m: 0.07
  output_cost_per_1m: 0.28
  billing_currency: USD
  pricing_source: project_model_profile
  pricing_effective_date: 2026-07-13
