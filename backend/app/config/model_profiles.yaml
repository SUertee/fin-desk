# LLM profiles — DeepSeek official API (platform.deepseek.com).
# Conventions follow yili-ai-workspace configs/models/vendors.yaml:
# provider / api_key_env / api_base_url / model per profile.
# DeepSeek V4 Flash is used directly with thinking disabled by the adapter.
# Prices are immutable profile snapshots from the official pricing page.

chat:
  provider: deepseek
  model: deepseek-v4-flash
  api_key_env: DEEPSEEK_API_KEY
  api_base_url: https://api.deepseek.com/v1
  temperature: 0.3
  max_tokens: 1200
  timeout_seconds: 30
  input_cost_per_1m: 0.14
  cached_input_cost_per_1m: 0.0028
  output_cost_per_1m: 0.28
  billing_currency: USD
  pricing_source: deepseek_official_pricing
  pricing_effective_date: 2026-07-15

