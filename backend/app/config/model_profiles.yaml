# LLM profiles — DeepSeek official API (platform.deepseek.com).
# Conventions follow yili-ai-workspace configs/models/vendors.yaml:
# provider / api_key_env / api_base_url / model per profile.
# deepseek-chat currently points at DeepSeek-V4 (non-reasoning) — right tier
# for composition/JSON tasks; reasoning variants add latency+cost for nothing.

chat:
  provider: deepseek
  model: deepseek-chat
  api_key_env: DEEPSEEK_API_KEY
  api_base_url: https://api.deepseek.com/v1
  temperature: 0.3
  max_tokens: 1200
  timeout_seconds: 30
  input_cost_per_1m: 0.07
  output_cost_per_1m: 0.28
  billing_currency: USD
  pricing_source: project_model_profile
  pricing_effective_date: 2026-07-13

specialist:
  provider: deepseek
  model: deepseek-chat
  api_key_env: DEEPSEEK_API_KEY
  api_base_url: https://api.deepseek.com/v1
  temperature: 0.2
  max_tokens: 900
  timeout_seconds: 30
  input_cost_per_1m: 0.07
  output_cost_per_1m: 0.28
  billing_currency: USD
  pricing_source: project_model_profile
  pricing_effective_date: 2026-07-13

