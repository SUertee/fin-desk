name: Agent Harness CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  harness:
    name: Backend harness and web build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests -q

      - name: Compile backend modules
        working-directory: backend
        run: python -m compileall -q app tests

      - name: Run trace export regression
        working-directory: backend
        run: |
          mkdir -p reports
          python -m app.evals.trace_export app/evals/samples/ci_traces.jsonl --output reports/trace-report.json

      - name: Run hermetic offline eval gate
        working-directory: backend
        run: python -m app.evals.harness_runner --output reports/offline-eval-report.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run web tests
        working-directory: web
        run: npm test

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-reports
          path: |
            backend/reports/trace-report.json
            backend/reports/offline-eval-report.json
          if-no-files-found: ignore
