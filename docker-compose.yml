services:
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_finance}
      POSTGRES_USER: ${POSTGRES_USER:-personal_finance_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-personal_finance_password}
    volumes:
      - finance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-personal_finance_user} -d ${POSTGRES_DB:-personal_finance}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18000}:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_ENV: docker
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-personal_finance_user}:${POSTGRES_PASSWORD:-personal_finance_password}@db:5432/${POSTGRES_DB:-personal_finance}
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:18001,http://127.0.0.1:18001}
    restart: unless-stopped

volumes:
  finance_postgres_data:
    name: personal-finance-team-data
