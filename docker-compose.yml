services:
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_finance}
      POSTGRES_USER: ${POSTGRES_USER:-personal_finance_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-personal_finance_password}
    volumes:
      - finance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-personal_finance_user} -d ${POSTGRES_DB:-personal_finance}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    ports:
      - "127.0.0.1:${OBJECT_STORAGE_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-findesk}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-findesksecret}
    command: server /data --console-address ":9001"
    volumes:
      - finance_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    image: findesk-backend:local
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18000}:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_ENV: docker
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-personal_finance_user}:${POSTGRES_PASSWORD:-personal_finance_password}@db:5432/${POSTGRES_DB:-personal_finance}
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:18001,http://127.0.0.1:18001}
      STATEMENT_INBOX_PATH: /data/statement-inbox
      STATEMENT_STORAGE_PATH: /data/statement-imports
      OBJECT_STORAGE_ENDPOINT: minio:9000
      OBJECT_STORAGE_EXTERNAL_ENDPOINT: localhost:9000
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-findesk}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-findesksecret}
    volumes:
      - ${FINDESK_STATEMENT_INBOX_HOST:-./storage/import-inbox}:/data/statement-inbox
      - statement_imports_data:/data/statement-imports
    restart: unless-stopped

  statement-worker:
    image: findesk-backend:local
    build:
      context: ./backend
    command: ["python", "-m", "app.workers.statement_inbox"]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_ENV: docker
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-personal_finance_user}:${POSTGRES_PASSWORD:-personal_finance_password}@db:5432/${POSTGRES_DB:-personal_finance}
      REDIS_URL: redis://redis:6379/0
      STATEMENT_INBOX_PATH: /data/statement-inbox
      STATEMENT_STORAGE_PATH: /data/statement-imports
    volumes:
      - ${FINDESK_STATEMENT_INBOX_HOST:-./storage/import-inbox}:/data/statement-inbox
      - statement_imports_data:/data/statement-imports
    restart: unless-stopped

volumes:
  finance_postgres_data:
    name: personal-finance-team-data
  finance_minio_data:
    name: personal-finance-team-assets
  statement_imports_data:
    name: personal-finance-team-statements
